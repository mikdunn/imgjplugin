name: build

on:
  push:
  pull_request:

jobs:
  maven:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build + test
        working-directory: FFT
        run: mvn -B test package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: imgjplugin-fft
          path: |
            FFT/target/*-shaded.jar
            FFT/target/*-all.jar
            FFT/target/surefire-reports/**
